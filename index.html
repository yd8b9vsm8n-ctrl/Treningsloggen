<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Treningsloggen">
  <meta name="description" content="Registrer styrke- og kondisjonsøkter på treningssenteret og følg fremgangen din.">
  <link rel="manifest" id="app-manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" id="app-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Hjemskjermikon etter telefonens tema: mørkt = original, lyst = hvit bakgrunn.
    // iPhone/Android lagrer ikonet idet appen legges til, så valget skjer da.
    (function () {
      var mq = window.matchMedia && matchMedia("(prefers-color-scheme: light)");
      function apply() {
        var light = !!(mq && mq.matches);
        document.getElementById("app-touch-icon").href = light ? "icons/apple-touch-icon-light.png" : "icons/apple-touch-icon.png";
        document.getElementById("app-manifest").href = light ? "manifest-light.webmanifest" : "manifest.webmanifest";
      }
      apply();
      if (mq && mq.addEventListener) mq.addEventListener("change", apply);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Sett farge og modus før siden tegnes, så det ikke blinker i feil farge.
    // Modus: "dark" | "light" | "auto" (følger telefonen). Standard: mørk oransje.
    (function () {
      var t = "orange", m = null;
      try { t = localStorage.getItem("treningslogg.theme") || "orange"; m = localStorage.getItem("treningslogg.mode"); } catch (e) {}
      if (["orange", "blue", "mint"].indexOf(t) < 0) t = "orange";
      // Fra forrige versjon var «Lys blå» et lyst tema – behold det utseendet
      if (!m) m = t === "blue" ? "light" : "dark";
      var mq = window.matchMedia && matchMedia("(prefers-color-scheme: light)");
      function apply() {
        var mode = m === "auto" ? (mq && mq.matches ? "light" : "dark") : m;
        var el = document.documentElement;
        el.dataset.theme = t;
        el.dataset.mode = mode;
        var bg = mode === "light" ? "#f6f8fc" : t === "mint" ? "#0d1714" : "#151515";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
      }
      apply();
      window.__applyAppearance = function (theme, mode) { t = theme; m = mode; apply(); };
      if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (m === "auto") apply(); });
    })();
  </script>
  <title>Treningsloggen</title>
</head>
<body>
  <!-- Introskjerm: logoen faller ned og lander, så tones appen fram (ca. 3 sek) -->
  <div id="splash" aria-hidden="true">
    <div class="splash-stage">
      <div class="splash-logo">
        <!-- Bare manualen (uten ikonbakgrunnen), beskåret tett rundt formen -->
        <svg viewBox="92 142 328 228" width="118" height="82">
          <defs>
            <linearGradient id="splash-fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: rgb(var(--accent2-rgb))"/><stop offset="1" style="stop-color: var(--accent)"/></linearGradient>
          </defs>
          <g fill="url(#splash-fg)">
            <rect x="96" y="176" width="40" height="160" rx="14"/>
            <rect x="144" y="146" width="48" height="220" rx="16"/>
            <rect x="320" y="146" width="48" height="220" rx="16"/>
            <rect x="376" y="176" width="40" height="160" rx="14"/>
            <rect x="192" y="238" width="128" height="36" rx="8"/>
          </g>
        </svg>
      </div>
      <div class="splash-shadow"></div>
      <p class="splash-name">Treningsloggen</p>
    </div>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Tilbake" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="titles">
      <p class="subtitle" id="subtitle" hidden></p>
      <h1 id="title">Treningsloggen</h1>
    </div>
    <!-- Tidtaker for økta som registreres; ligger i topplinja og følger derfor med ved scrolling -->
    <div class="top-timer" id="top-timer" hidden aria-live="off">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 2M10 2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-timer>0 min</span>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Hovedmeny">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Hjem</span>
    </a>
    <a href="#/okt" data-tab="okt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
      <span>Økt</span>
    </a>
    <a href="#/historikk" data-tab="historikk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Historikk</span>
    </a>
    <a href="#/statistikk" data-tab="statistikk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>
      <span>Statistikk</span>
    </a>
    <a href="#/mer" data-tab="mer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      <span>Mer</span>
    </a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
